name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical verification
        run: make verify
      - name: Assert verification did not mutate checkout
        run: test -z "$(git status --porcelain)"
